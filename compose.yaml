name: loanbroker

services:
  app:
    build:
      context: ./docker
    volumes:
      - .:/var/www/html
    ports:
      - "8090:8000"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loanbroker
      POSTGRES_USER: loanbroker
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/pgsql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanbroker -d loanbroker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine

volumes:
  pgsql-data:
